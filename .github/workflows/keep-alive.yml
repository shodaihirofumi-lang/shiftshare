name: Keep Render Awake (4-17時JST)

# Renderの無料プランは15分アクセスがないと眠り、起こし直すのに30〜60秒かかる（＝最初の操作が
# 重く見える／追加できない様に見える）。そこで日中にサーバーを起こし続けて、アプリを常にサクサクにする。
# 【重要】pingでサーバーが起きている時間はRenderの無料枠(約750h/月)を消費する。
# そのため24時間ではなく「起きている時間帯(4:00〜17:00 JST)」に限定して枠を使い切らないようにする。
#   - 稼働: 毎日 04:00〜17:00(JST) ＝ 約13時間/日 → 月およそ403h（750hに余裕を持って収まる）
#   - 日中はアプリがすぐ反応する。出勤2時間前アラーム（朝〜昼の出勤）もこの時間帯でカバー。
#   - 深夜 00:00〜04:00(JST) 付近は眠る（就寝中なので影響なし）。夕方17時以降もアクセスが無ければ眠る。

on:
  schedule:
    # GitHub ActionsのcronはUTC。JST = UTC+9。
    # 04:00〜17:00(JST) = 19:00〜23:59(UTC前日) ＋ 00:00〜07:59(UTC)。
    # cronは5〜15分遅延することがあるので、15分の睡眠閾値を確実にカバーするため5分ごと。
    - cron: '*/5 19-23 * * *'   # JST 04:00〜08:55
    - cron: '*/5 0-7 * * *'     # JST 09:00〜16:55
  workflow_dispatch:         # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 60 \
            --retry 2 --retry-delay 5 \
            https://shiftshare.onrender.com/api/status
