name: Keep Render Awake (朝だけ)

# 出勤2時間前アラームを確実に届けるため、朝の時間帯だけRenderのサーバーをpingでKeep-Aliveする。
# 【重要】pingでサーバーが起きている時間はRenderの無料枠(約750h/月)を消費する。
# そのため24時間ではなく朝だけに限定して、枠を使い切らないようにしている。
#   - 稼働: 毎日 04:00〜11:00(JST) ＝ 約7時間/日 → 月およそ217h（750hに十分収まる）
#   - この時間帯にサーバーが起きていれば、朝〜昼(出勤6:00〜13:00頃)のアラームが2時間前に鳴る
#   - 夕方・夜シフトの2時間前アラームは対象外（必要なら afternoon の窓を追加できる）

on:
  schedule:
    # GitHub ActionsのcronはUTC。JST = UTC+9。
    # 04:00〜10:55(JST) = 19:00〜23:55 + 00:00〜01:55(UTC)。
    # cronは5〜15分遅延することがあるので、15分の睡眠閾値を確実にカバーするため5分ごと。
    - cron: '*/5 19-23 * * *'
    - cron: '*/5 0-1 * * *'
  workflow_dispatch:         # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 60 \
            --retry 2 --retry-delay 5 \
            https://shiftshare.onrender.com/api/status
