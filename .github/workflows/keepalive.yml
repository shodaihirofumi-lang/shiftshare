name: Keep Render awake

# Renderの無料プランは15分アクセスが無いと眠り、次回起動に〜50秒かかる。
# → 10分おきにトップページ(静的HTML)へHEAD pingして眠らせない＝初回読み込みを速く保つ。
#
# 【なぜループ方式か】
# GitHubの cron(schedule) は遅延・間引きが多く、`*/10` だと実際には数時間に1回しか
# 動かないことがある(実測でそうなった)。そこで「1回のトリガーで約5.5時間ぶん、
# ジョブ内で10分おきにpingし続ける」方式にする。タイミングをGitHubのcronに依存せず
# ジョブ自身のsleepで刻むため、確実に10分間隔を保てる。
# 3時間ごとにトリガーして多重起動で隙間を埋める(公開リポジトリなのでActionsは無料・無制限)。
# pingはAIを呼ばないのでAnthropic APIの課金は発生しない。

on:
  schedule:
    - cron: '13 * * * *'      # 毎時:13に試行（GitHubは半分以上落とすので頻度を上げて多重起動で埋める）
  workflow_dispatch:          # 手動実行も可

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 358      # 約5h55m、GitHubの上限6時間内
    steps:
      - name: Ping every 10 min (~5h55m) so Render never sleeps
        run: |
          end=$(( $(date +%s) + 21300 ))   # 5h55m後まで（複数runが重なって隙間ゼロを狙う）
          while [ "$(date +%s)" -lt "$end" ]; do
            # HEADリクエスト(-I)で本文を受け取らず通信量を最小化しつつ起こす
            code=$(curl -s -I -o /dev/null -w "%{http_code}" --max-time 90 https://shiftshare.onrender.com/ || echo "000")
            echo "$(date -u +%H:%M)Z HTTP $code"
            sleep 600
          done
