# Fly.io デプロイ設定
# 常時1台起動でコールドスタート回避。shared-cpu-1x@256mb は無料枠($5クレジット)内で常時起動可能
app = "shiftshare"
primary_region = "nrt"  # 東京

[build]

[env]
  PORT = "8000"
  # BASE_URL はデプロイ後に `fly secrets set BASE_URL=https://shiftshare.fly.dev` で設定する

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # 眠らせない
  auto_start_machines = true
  min_machines_running = 1     # 常に1台起動
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
