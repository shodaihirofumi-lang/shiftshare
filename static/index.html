<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ShiftShare</title>
<style>
:root {
  --bg-grad: linear-gradient(165deg, #ece7de 0%, #e1dbce 100%);
  --bg: #e8e3da;
  --card: #fbf9f5;
  --text: #3c3732;
  --text-soft: #978d80;
  --line: #ded7ca;
  --line-soft: #ebe5da;

  --mine: #4f6d7a;        /* ひろ — dusty teal slate */
  --mine-bg: #e8eff1;
  --mine-border: #c1d1d5;
  --hers: #a76b80;        /* ちか — dusty mauve rose */
  --hers-bg: #f4ebef;
  --hers-border: #dec8d1;

  --gold: #a4884f;        /* champagne bronze */
  --gold-bg: #f0e8d8;
  --gold-border: #d6c39c;

  --grad: linear-gradient(135deg, #566e78, #4a4655);
  --shadow: 0 4px 22px rgba(60,55,50,.09);
  --shadow-sm: 0 2px 10px rgba(60,55,50,.06);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'Hiragino Mincho ProN','Hiragino Sans','Yu Gothic',serif; background:var(--bg); color:var(--text); min-height:100vh; }
body, button, input { font-family:'Hiragino Sans','Yu Gothic',sans-serif; }

.screen { display:none; }
.screen.active { display:block; }

/* ── LOGIN ── */
#login { min-height:100vh; padding:24px; gap:42px; background:var(--bg-grad); }
#login.active { display:flex; flex-direction:column; justify-content:center; align-items:center; }
.logo-mark {
  width:74px; height:74px; background:var(--grad); border-radius:24px;
  display:flex; align-items:center; justify-content:center; margin:0 auto 18px;
  box-shadow:0 14px 34px rgba(74,70,85,.26);
}
.logo-text h1 { font-size:23px; font-weight:600; letter-spacing:5px; text-align:center; color:var(--text); }
.logo-text p { font-size:12px; color:var(--text-soft); text-align:center; margin-top:8px; letter-spacing:1px; }
.login-card { background:var(--card); border-radius:22px; padding:34px 28px; width:100%; max-width:340px; box-shadow:var(--shadow); }
.field-label { font-size:10px; color:var(--text-soft); letter-spacing:3px; font-weight:600; display:block; margin-bottom:10px; }
.passcode-input {
  width:100%; padding:15px 16px; background:#f4f1ea; border:1.5px solid var(--line);
  border-radius:12px; color:var(--text); font-size:22px; letter-spacing:10px; text-align:center;
  outline:none; margin-bottom:22px;
}
.passcode-input:focus { border-color:var(--mine); }
.btn-primary {
  width:100%; padding:15px; background:var(--grad); border:none; border-radius:13px;
  color:#fbf9f5; font-size:13px; font-weight:600; cursor:pointer; letter-spacing:3px;
  box-shadow:0 6px 18px rgba(74,70,85,.22);
}
.btn-primary:active { opacity:.92; transform:scale(.99); }
.login-err { color:#b5544f; font-size:12px; text-align:center; margin-top:12px; min-height:18px; }

/* ── APP SHELL ── */
#app { display:none; flex-direction:column; min-height:100vh; }
.app-content { flex:1; overflow-y:auto; padding:0 18px 92px; max-width:480px; margin:0 auto; width:100%; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position:fixed; bottom:0; left:0; right:0; background:var(--card);
  border-top:1px solid var(--line-soft); display:flex; justify-content:space-around;
  padding:11px 0 max(20px,env(safe-area-inset-bottom)); box-shadow:0 -4px 22px rgba(60,55,50,.07); z-index:100;
}
.nav-btn {
  display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; font-weight:600;
  color:#bcb2a4; background:none; border:none; cursor:pointer; padding:4px 28px; letter-spacing:1px; transition:color .15s;
}
.nav-btn.active { color:var(--mine); }

/* ── HEADERS ── */
.page-top { display:flex; justify-content:space-between; align-items:flex-start; padding:22px 0 16px; }
.page-title { font-size:22px; font-weight:600; letter-spacing:1px; }
.page-sub { font-size:11px; color:var(--text-soft); margin-top:4px; letter-spacing:.5px; }
.chip-green { font-size:11px; font-weight:600; color:#6e8b6a; background:#e7eee2; padding:5px 12px; border-radius:18px; white-space:nowrap; }
.chip-gray { font-size:11px; font-weight:600; color:var(--text-soft); background:#efe9de; padding:5px 12px; border-radius:18px; white-space:nowrap; }

/* ── LEGEND ── */
.legend { display:flex; gap:16px; margin-bottom:18px; background:var(--card); border-radius:14px; padding:11px 15px; box-shadow:var(--shadow-sm); }
.leg { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text); font-weight:500; }
.leg-ava {
  width:20px; height:20px; border-radius:50%; background:#efe9de; object-fit:cover;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;
  border:1.5px solid var(--line);
}
.leg-ava.mine { border-color:var(--mine-border); }
.leg-ava.hers { border-color:var(--hers-border); }
.leg-dot { width:11px; height:11px; border-radius:3px; }

/* ── CALENDAR ── */
.cal-grid { display:flex; flex-direction:column; gap:6px; }
.cal-row { display:grid; grid-template-columns:50px 1fr 1fr; gap:6px; }
.cal-date { display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:14px; padding:8px 0; }
.dn { font-size:17px; font-weight:600; line-height:1; }
.dw { font-size:10px; margin-top:3px; font-weight:500; }
.cal-date.wd { background:#eceae3; color:#74695b; }
.cal-date.su { background:#f0e6e3; color:#a36a64; }
.cal-date.sa { background:#e9ecef; color:#6a7384; }
.cal-date.gold { background:var(--gold-bg); color:var(--gold); border:1.5px solid var(--gold-border); }

.shift-cell { border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; justify-content:center; min-height:56px; background:var(--card); }
.sc-lbl { font-size:10px; font-weight:600; letter-spacing:.5px; margin-bottom:3px; display:flex; align-items:center; gap:5px; }
.sc-ava { width:16px; height:16px; border-radius:50%; object-fit:cover; flex-shrink:0; }
.sc-time { font-size:14px; font-weight:700; }
.sc-end { font-size:11px; opacity:.6; }
.sc-mine { background:var(--mine-bg); border:1.5px solid var(--mine-border); color:var(--mine); }
.sc-hers { background:var(--hers-bg); border:1.5px solid var(--hers-border); color:var(--hers); }
.sc-off { background:#f3efe7; border:1.5px solid var(--line); color:#a89e90; font-size:12px; font-weight:600; text-align:center; align-items:center; }
.sc-off span { background:#eae3d7; padding:3px 10px; border-radius:6px; font-size:11px; }
.sc-gold { background:var(--gold-bg); border:1.5px solid var(--gold-border); color:var(--gold); font-size:12px; font-weight:600; text-align:center; align-items:center; }
.sc-gold span { background:#e9dcc1; padding:3px 10px; border-radius:6px; font-size:11px; }
.sc-empty { background:transparent; border:1.5px dashed var(--line); }

.both-off-banner {
  grid-column:1/-1; background:linear-gradient(90deg,var(--gold-bg),#f4eedf); border:1px solid var(--gold-border);
  border-radius:8px; padding:6px 12px; font-size:11px; font-weight:600; color:var(--gold);
  text-align:center; display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:1px; letter-spacing:1px;
}

/* ── UPLOAD ── */
.sect-label { font-size:10px; color:var(--text-soft); letter-spacing:3px; font-weight:600; margin-bottom:12px; }
.person-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
.person-card {
  padding:20px 12px 16px; border-radius:18px; border:1.5px solid var(--line); background:var(--card);
  text-align:center; cursor:pointer; box-shadow:var(--shadow-sm); transition:all .2s; position:relative;
}
.person-card.sel-mine { background:var(--mine-bg); border-color:var(--mine); }
.person-card.sel-hers { background:var(--hers-bg); border-color:var(--hers); }
.pc-avatar {
  width:62px; height:62px; border-radius:50%; margin:0 auto 12px; position:relative;
  background:#efe9de; display:flex; align-items:center; justify-content:center; overflow:hidden;
  border:2px solid var(--line); cursor:pointer;
}
.person-card.sel-mine .pc-avatar { border-color:var(--mine-border); }
.person-card.sel-hers .pc-avatar { border-color:var(--hers-border); }
.pc-avatar img { width:100%; height:100%; object-fit:cover; }
.pc-avatar input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }
.pc-cam {
  position:absolute; bottom:-2px; right:-2px; width:22px; height:22px; border-radius:50%;
  background:var(--grad); display:flex; align-items:center; justify-content:center; border:2px solid var(--card);
}
.pc-name { font-size:15px; font-weight:600; color:var(--text); letter-spacing:1px; }
.person-card.sel-mine .pc-name { color:var(--mine); }
.person-card.sel-hers .pc-name { color:var(--hers); }

.drop-zone { border:1.5px dashed #c8bca7; border-radius:20px; padding:36px 20px; text-align:center; background:#f4f0e8; margin-bottom:16px; cursor:pointer; position:relative; }
.drop-zone input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }
.drop-icon { width:50px; height:50px; background:#e9e2d4; border-radius:14px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
.drop-zone h3 { font-size:14px; color:var(--text); margin-bottom:5px; font-weight:600; }
.drop-zone p { font-size:12px; color:var(--text-soft); }
.drop-hint { display:inline-block; margin-top:14px; background:#e9e2d4; color:#8a7a5a; padding:4px 14px; border-radius:18px; font-size:11px; font-weight:600; }

.preview-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
.preview-card {
  border-radius:14px; aspect-ratio:9/16; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; font-size:12px; font-weight:600; background:#f3efe7; border:1.5px dashed var(--line); color:var(--text-soft);
  position:relative; overflow:hidden;
}
.preview-card.has-img { border-style:solid; background:var(--mine-bg); border-color:var(--mine-border); color:var(--mine); }
.preview-card img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:12px; }
.preview-card .pg-label { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); background:rgba(251,249,245,.92); color:var(--mine); font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; }

.btn-analyze {
  width:100%; padding:16px; background:var(--grad); border:none; border-radius:15px; color:#fbf9f5;
  font-size:14px; font-weight:600; cursor:pointer; letter-spacing:1px; display:flex; align-items:center;
  justify-content:center; gap:10px; box-shadow:0 6px 18px rgba(74,70,85,.22);
}
.btn-analyze:disabled { opacity:.45; cursor:not-allowed; }

/* ── OVERLAY ── */
.overlay { position:fixed; inset:0; background:rgba(232,227,218,.93); backdrop-filter:blur(6px); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:200; gap:20px; }
.overlay.active { display:flex; }
.ring { width:54px; height:54px; border:3px solid #ddd5c7; border-top-color:var(--mine); border-radius:50%; animation:spin .9s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.overlay h3 { font-size:16px; font-weight:600; color:var(--text); letter-spacing:1px; }
.overlay p { font-size:12px; color:var(--text-soft); }

/* ── TOAST ── */
.toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--card); color:var(--text); padding:13px 20px; border-radius:13px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px; box-shadow:0 8px 30px rgba(60,55,50,.16); white-space:nowrap; z-index:300; border-left:3px solid var(--mine); opacity:0; pointer-events:none; transition:opacity .3s, top .3s; }
.toast.show { opacity:1; top:24px; }

.empty-state { text-align:center; padding:60px 20px; font-size:13px; color:var(--text-soft); line-height:1.9; }

/* ── DAY EDITOR MODAL ── */
.modal-bg { position:fixed; inset:0; background:rgba(60,55,50,.45); backdrop-filter:blur(4px); display:none; align-items:flex-end; justify-content:center; z-index:250; }
.modal-bg.active { display:flex; }
.modal { background:var(--card); border-radius:24px 24px 0 0; width:100%; max-width:480px; padding:24px 20px calc(28px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; animation:slideUp .25s ease; }
@keyframes slideUp { from { transform:translateY(40px); opacity:.6; } to { transform:translateY(0); opacity:1; } }
@media(min-width:520px){ .modal-bg{align-items:center} .modal{border-radius:24px} }
.modal-title { font-size:19px; font-weight:600; }
.modal-sub { font-size:12px; color:var(--text-soft); margin:4px 0 20px; }
.edit-person { margin-bottom:14px; padding:16px; border-radius:16px; border:1.5px solid var(--line); }
.edit-person.mine { background:var(--mine-bg); border-color:var(--mine-border); }
.edit-person.hers { background:var(--hers-bg); border-color:var(--hers-border); }
.edit-name { font-size:14px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.type-toggle { display:flex; gap:6px; margin-bottom:12px; }
.type-btn { flex:1; padding:9px 0; border-radius:10px; border:1.5px solid var(--line); background:var(--card); font-size:12px; font-weight:600; color:var(--text-soft); cursor:pointer; }
.type-btn.active { background:var(--text); color:var(--card); border-color:var(--text); }
.time-row { display:flex; gap:10px; align-items:center; }
.time-row input[type=time] { flex:1; padding:11px; border-radius:10px; border:1.5px solid var(--line); font-size:16px; background:var(--card); color:var(--text); font-family:inherit; }
.time-sep { color:var(--text-soft); }
.label-select { width:100%; padding:11px; border-radius:10px; border:1.5px solid var(--line); font-size:15px; background:var(--card); color:var(--text); font-family:inherit; }
.modal-actions { display:flex; gap:10px; margin-top:10px; }
.btn-cancel { flex:1; padding:14px; border-radius:13px; border:1.5px solid var(--line); background:var(--card); color:var(--text-soft); font-size:14px; font-weight:600; cursor:pointer; }
.btn-save { flex:2; padding:14px; border-radius:13px; border:none; background:var(--grad); color:#fbf9f5; font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 6px 18px rgba(74,70,85,.22); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="screen active">
  <div class="logo-mark">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fbf9f5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
  </div>
  <div class="logo-text"><h1>SHIFTSHARE</h1><p>ふたりのシフトを、ひとつに</p></div>
  <div class="login-card">
    <label class="field-label">PASSCODE</label>
    <input id="pw" class="passcode-input" type="password" placeholder="••••" maxlength="20">
    <button class="btn-primary" onclick="doLogin()">LOGIN</button>
    <div id="login-err" class="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-content">

    <!-- CALENDAR -->
    <div id="tab-calendar" class="screen active">
      <div class="page-top">
        <div>
          <div class="page-title" id="cal-title">カレンダー</div>
          <div class="page-sub" id="cal-period">—</div>
        </div>
        <div id="cal-status" class="chip-gray">未登録</div>
      </div>
      <div class="legend">
        <div class="leg"><span class="leg-ava mine" id="leg-ava-mine"></span><span id="leg-name-mine">ひろ</span></div>
        <div class="leg"><span class="leg-ava hers" id="leg-ava-hers"></span><span id="leg-name-hers">ちか</span></div>
        <div class="leg"><div class="leg-dot" style="background:var(--gold)"></div>ふたり休み</div>
      </div>
      <div id="cal-grid" class="cal-grid">
        <div class="empty-state">シフトがまだ登録されていません。<br>アップロードからスクショを送ってください。</div>
      </div>
    </div>

    <!-- UPLOAD -->
    <div id="tab-upload" class="screen">
      <div class="page-top">
        <div><div class="page-title">アップロード</div><div class="page-sub">スクショを2枚選ぶだけ</div></div>
      </div>

      <div class="sect-label">WHOSE SHIFT</div>
      <div class="person-grid">
        <div class="person-card sel-mine" id="card-mine" onclick="selectPerson('mine')">
          <div class="pc-avatar" id="ava-mine" onclick="event.stopPropagation()">
            <span class="pc-ph"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b9ad9c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input type="file" accept="image/*" onchange="onAvatar('mine', this.files[0])">
            <div class="pc-cam"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fbf9f5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
          </div>
          <div class="pc-name">ひろ</div>
        </div>
        <div class="person-card" id="card-hers" onclick="selectPerson('hers')">
          <div class="pc-avatar" id="ava-hers" onclick="event.stopPropagation()">
            <span class="pc-ph"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#b9ad9c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input type="file" accept="image/*" onchange="onAvatar('hers', this.files[0])">
            <div class="pc-cam"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fbf9f5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
          </div>
          <div class="pc-name">ちか</div>
        </div>
      </div>

      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept="image/*" multiple onchange="onFiles(this.files)">
        <div class="drop-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a7a5a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
        <h3>スクショを選択</h3>
        <p>Rシフトのスクショを2枚アップ</p>
        <span class="drop-hint">2枚まで選択可</span>
      </div>

      <div class="preview-grid">
        <div class="preview-card" id="prev-0"><span style="font-size:12px;color:var(--text-soft)">1枚目</span></div>
        <div class="preview-card" id="prev-1"><span style="font-size:12px;color:var(--text-soft)">2枚目</span></div>
      </div>

      <button class="btn-analyze" id="btn-analyze" onclick="doUpload()" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fbf9f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        AIでシフトを読み取る
      </button>
    </div>

  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-calendar" onclick="showTab('calendar')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      カレンダー
    </button>
    <button class="nav-btn" id="nav-upload" onclick="showTab('upload')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      アップロード
    </button>
  </nav>
</div>

<div class="overlay" id="overlay"><div class="ring"></div><h3>AIがシフトを解析中…</h3><p>しばらくお待ちください</p></div>
<div class="toast" id="toast"></div>

<!-- DAY EDITOR MODAL -->
<div class="modal-bg" id="day-editor" onclick="if(event.target===this)closeEditor()">
  <div class="modal">
    <div class="modal-title" id="ed-title">編集</div>
    <div class="modal-sub">時間や種類をタップで編集できます</div>
    <div class="edit-person mine" id="ed-mine"></div>
    <div class="edit-person hers" id="ed-hers"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeEditor()">キャンセル</button>
      <button class="btn-save" onclick="saveEditor()">保存</button>
    </div>
  </div>
</div>

<script>
const NAMES = { mine: 'ひろ', hers: 'ちか' };
let selectedPerson = 'mine';
let selectedFiles = [];
let avatars = {};
let shiftsByDate = {};
let editorDate = null;
const edTypes = { mine: 'none', hers: 'none' };

// ── AUTH ──
async function doLogin() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('login-err');
  err.textContent = '';
  try {
    const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw}) });
    if (!r.ok) { err.textContent = 'パスワードが違います'; return; }
    sessionStorage.setItem('auth','1');
    enterApp();
  } catch { err.textContent = '接続エラー'; }
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });

function enterApp() {
  document.getElementById('login').classList.remove('active');
  document.getElementById('app').style.display = 'flex';
  loadAvatars();
  loadCalendar();
  setupPush();
}
if (sessionStorage.getItem('auth')) enterApp();

// ── TABS ──
function showTab(name) {
  ['calendar','upload'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
    document.getElementById('nav-'+t).classList.toggle('active', t===name);
  });
}

// ── AVATARS ──
async function loadAvatars() {
  try { avatars = await fetch('/api/avatars').then(r=>r.json()); } catch { avatars = {}; }
  renderAvatar('mine'); renderAvatar('hers');
}
function renderAvatar(person) {
  const url = avatars[person];
  // person card
  const ava = document.getElementById('ava-'+person);
  const ph = ava.querySelector('.pc-ph');
  let img = ava.querySelector('img');
  if (url) {
    if (!img) { img = document.createElement('img'); ava.insertBefore(img, ava.firstChild); }
    img.src = url;
    if (ph) ph.style.display = 'none';
  }
  // legend
  const leg = document.getElementById('leg-ava-'+person);
  if (url) { leg.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover">`; }
  else { leg.innerHTML = `<span style="width:7px;height:7px;border-radius:2px;background:var(--${person})"></span>`; }
}
async function onAvatar(person, file) {
  if (!file) return;
  const dataUrl = await resizeImage(file, 240);
  avatars[person] = dataUrl;
  renderAvatar(person);
  try {
    await fetch('/api/avatar', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({person, image:dataUrl}) });
    showToast(`${NAMES[person]}のアイコンを設定しました`);
    loadCalendar();
  } catch { showToast('アイコンの保存に失敗しました', true); }
}
function resizeImage(file, max) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width:w, height:h } = img;
        const scale = Math.min(1, max/Math.max(w,h));
        w = Math.round(w*scale); h = Math.round(h*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ── CALENDAR ──
async function loadCalendar() {
  const [shifts, status] = await Promise.all([
    fetch('/api/shifts').then(r=>r.json()),
    fetch('/api/status').then(r=>r.json()),
  ]);
  renderCalendar(shifts, status);
}
function renderCalendar(shifts, status) {
  const both = status.mine && status.hers, any = status.mine || status.hers;
  const chip = document.getElementById('cal-status');
  chip.textContent = both ? 'ふたり登録済み' : any ? '片方登録済み' : '未登録';
  chip.className = both ? 'chip-green' : 'chip-gray';

  if (!shifts.length) {
    document.getElementById('cal-grid').innerHTML = '<div class="empty-state">シフトがまだ登録されていません。<br>アップロードからスクショを送ってください。</div>';
    return;
  }
  const byDate = {};
  for (const s of shifts) {
    const key = `${s.year}-${String(s.month).padStart(2,'0')}-${String(s.day).padStart(2,'0')}`;
    (byDate[key] ||= {})[s.person] = s;
  }
  shiftsByDate = byDate;
  const keys = Object.keys(byDate).sort();
  const fd = parseKey(keys[0]), ld = parseKey(keys[keys.length-1]);
  document.getElementById('cal-period').textContent = `${fd.month}月${fd.day}日 〜 ${ld.month}月${ld.day}日`;
  document.getElementById('cal-title').textContent = `${fd.month}月 — ${ld.month}月`;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const dayNames = ['日','月','火','水','木','金','土'];
  for (const key of keys) {
    const { year, month, day } = parseKey(key);
    const dow = new Date(year, month-1, day).getDay();
    const mine = byDate[key].mine, hers = byDate[key].hers;
    const bothOff = mine && hers && mine.shift_type==='off' && hers.shift_type==='off';
    if (bothOff) {
      const b = document.createElement('div'); b.className = 'cal-row';
      b.innerHTML = `<div class="both-off-banner" style="grid-column:1/-1"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>ふたりともお休み</div>`;
      grid.appendChild(b);
    }
    const row = document.createElement('div'); row.className = 'cal-row';
    const dc = dow===0 ? 'su' : dow===6 ? 'sa' : 'wd';
    row.innerHTML = `<div class="cal-date ${bothOff?'gold':dc}"><span class="dn">${day}</span><span class="dw">${dayNames[dow]}</span></div>${shiftCell(mine,'mine',bothOff)}${shiftCell(hers,'hers',bothOff)}`;
    row.style.cursor = 'pointer';
    row.addEventListener('click', () => openDayEditor(key));
    grid.appendChild(row);
  }
}

// ── DAY EDITOR ──
function openDayEditor(key) {
  editorDate = key;
  const { year, month, day } = parseKey(key);
  const dow = ['日','月','火','水','木','金','土'][new Date(year, month-1, day).getDay()];
  document.getElementById('ed-title').textContent = `${month}月${day}日（${dow}）`;
  const data = shiftsByDate[key] || {};
  for (const p of ['mine','hers']) {
    const s = data[p];
    edTypes[p] = s ? (s.shift_type === 'off' ? 'off' : 'work') : 'none';
    document.getElementById('ed-'+p).innerHTML = buildPersonEditor(p, s);
  }
  document.getElementById('day-editor').classList.add('active');
}
function buildPersonEditor(person, s) {
  const t = edTypes[person];
  const start = s?.start_time || '';
  const end = s?.end_time || '';
  const label = s?.label || '公休';
  const ava = avatars[person] ? `<img class="sc-ava" src="${avatars[person]}">` : '';
  const opt = v => `<option ${label===v?'selected':''}>${v}</option>`;
  return `
    <div class="edit-name">${ava}${NAMES[person]}</div>
    <div class="type-toggle" data-person="${person}">
      <button class="type-btn ${t==='work'?'active':''}" onclick="setType('${person}','work')">仕事</button>
      <button class="type-btn ${t==='off'?'active':''}" onclick="setType('${person}','off')">休み</button>
      <button class="type-btn ${t==='none'?'active':''}" onclick="setType('${person}','none')">なし</button>
    </div>
    <div id="edwork-${person}" style="display:${t==='work'?'block':'none'}">
      <div class="time-row">
        <input type="time" id="edstart-${person}" value="${start}">
        <span class="time-sep">〜</span>
        <input type="time" id="edend-${person}" value="${end}">
      </div>
    </div>
    <div id="edoff-${person}" style="display:${t==='off'?'block':'none'}">
      <select class="label-select" id="edlabel-${person}">${opt('公休')}${opt('有休')}${opt('希望休')}</select>
    </div>`;
}
function setType(person, type) {
  edTypes[person] = type;
  const tg = document.querySelector(`.type-toggle[data-person="${person}"]`);
  [...tg.children].forEach((b,i) => b.classList.toggle('active', i === {work:0,off:1,none:2}[type]));
  document.getElementById('edwork-'+person).style.display = type==='work' ? 'block' : 'none';
  document.getElementById('edoff-'+person).style.display = type==='off' ? 'block' : 'none';
}
function closeEditor() { document.getElementById('day-editor').classList.remove('active'); }
async function saveEditor() {
  const { year, month, day } = parseKey(editorDate);
  try {
    for (const person of ['mine','hers']) {
      const t = edTypes[person];
      const body = { person, year, month, day, shift_type: t };
      if (t === 'work') {
        body.start_time = document.getElementById('edstart-'+person).value || null;
        body.end_time = document.getElementById('edend-'+person).value || null;
      } else if (t === 'off') {
        body.label = document.getElementById('edlabel-'+person).value;
      }
      await fetch('/api/shift', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    }
    closeEditor();
    showToast('シフトを更新しました');
    await loadCalendar();
  } catch { showToast('更新に失敗しました', true); }
}
function shiftCell(s, person, bothOff) {
  if (!s) return '<div class="shift-cell sc-empty"></div>';
  if (s.shift_type === 'off') {
    return `<div class="shift-cell ${bothOff?'sc-gold':'sc-off'}"><span>${s.label||'公休'}</span></div>`;
  }
  const ava = avatars[person] ? `<img class="sc-ava" src="${avatars[person]}">` : '';
  return `<div class="shift-cell ${person==='mine'?'sc-mine':'sc-hers'}"><span class="sc-lbl">${ava}${NAMES[person]}</span><span class="sc-time">${s.start_time||''}</span><span class="sc-end">〜 ${s.end_time||''}</span></div>`;
}
function parseKey(k) { const [year,month,day]=k.split('-').map(Number); return {year,month,day}; }

// ── UPLOAD ──
function selectPerson(p) {
  selectedPerson = p;
  document.getElementById('card-mine').className = 'person-card'+(p==='mine'?' sel-mine':'');
  document.getElementById('card-hers').className = 'person-card'+(p==='hers'?' sel-hers':'');
}
function onFiles(files) {
  selectedFiles = Array.from(files).slice(0,2);
  for (let i=0;i<2;i++) {
    const card = document.getElementById('prev-'+i);
    if (selectedFiles[i]) {
      const url = URL.createObjectURL(selectedFiles[i]);
      card.innerHTML = `<img src="${url}"><div class="pg-label">PAGE ${i+1}</div>`;
      card.classList.add('has-img');
    } else {
      card.classList.remove('has-img');
      card.innerHTML = `<span style="font-size:12px;color:var(--text-soft)">${i+1}枚目</span>`;
    }
  }
  document.getElementById('btn-analyze').disabled = selectedFiles.length===0;
}
async function doUpload() {
  if (!selectedFiles.length) return;
  document.getElementById('overlay').classList.add('active');
  const form = new FormData();
  form.append('person', selectedPerson);
  for (const f of selectedFiles) form.append('files', f);
  try {
    const r = await fetch('/api/upload', { method:'POST', body:form });
    if (!r.ok) { const e = await r.json().catch(()=>({detail:'不明なエラー'})); throw new Error(e.error||e.detail||'エラー'); }
    const data = await r.json();
    showToast(`${data.count}件のシフトを登録しました`);
    selectedFiles = []; document.getElementById('file-input').value=''; onFiles([]);
    await loadCalendar(); showTab('calendar');
  } catch (e) { showToast(`エラー: ${e.message}`, true); }
  finally { document.getElementById('overlay').classList.remove('active'); }
}

// ── TOAST ──
let toastTimer;
function showToast(msg, isErr=false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.borderLeftColor = isErr ? '#b5544f' : 'var(--mine)';
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3500);
}

// ── PUSH ──
async function setupPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    const { publicKey } = await fetch('/api/vapid-key').then(r=>r.json());
    if (!publicKey) return;
    if (await Notification.requestPermission() !== 'granted') return;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:urlB64(publicKey) });
    await fetch('/api/push/subscribe', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(sub) });
  } catch {}
}
function urlB64(s) {
  const pad = '='.repeat((4-s.length%4)%4);
  const b = (s+pad).replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from([...atob(b)].map(c=>c.charCodeAt(0)));
}
</script>
</body>
</html>
