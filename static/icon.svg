<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3038"/>
      <stop offset="1" stop-color="#141821"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5c692"/>
      <stop offset=".55" stop-color="#c8a56e"/>
      <stop offset="1" stop-color="#8f7548"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dda3b6"/>
      <stop offset=".55" stop-color="#b47286"/>
      <stop offset="1" stop-color="#7d4a58"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".3" cy=".25" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 深い夜のような背景 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#sheen)"/>

  <!-- 二つの絡み合う輪 (ふたつの人生が重なる) -->
  <g fill="none" stroke-width="7" stroke-linecap="round">
    <circle cx="196" cy="256" r="118" stroke="url(#gold)"/>
    <circle cx="316" cy="256" r="118" stroke="url(#rose)"/>
  </g>

  <!-- 中央の小さなパール -->
  <circle cx="256" cy="256" r="5" fill="#f2e4c2" opacity=".9"/>

  <!-- 上下の細い装飾ライン (エディトリアル感) -->
  <line x1="176" y1="72" x2="336" y2="72" stroke="#c9a878" stroke-width="1" opacity=".35"/>
  <line x1="176" y1="440" x2="336" y2="440" stroke="#c9a878" stroke-width="1" opacity=".35"/>
</svg>
